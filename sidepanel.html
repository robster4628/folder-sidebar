<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Folder Sidebar</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <div id="top">
      <input id="filter" type="search" placeholder="Search saved links and tabs" autocomplete="off" spellcheck="false">
    </div>
    <div id="apps" class="grid"></div>
    <div id="scroller">
      <div id="spaceName"></div>
      <div id="tree" class="list"></div>
      <div id="newTab" class="row ghost"><span class="ico plus">+</span><span class="label">New Tab</span></div>
      <div id="todayDivider" class="divider"></div>
      <div id="today" class="list"></div>
      <div id="results" class="list"></div>
    </div>
    <div id="footer">
      <button id="menuBtn" class="iconbtn" title="Menu">⋯</button>
      <div id="spaces"></div>
      <button id="addSpace" class="iconbtn" title="New space">+</button>
    </div>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden><div class="box"></div></div>
  <div id="toast" hidden></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <script src="import.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
